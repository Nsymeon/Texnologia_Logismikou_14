
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Heart Risk Predictor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Heart Disease Risk Prediction</h1>
  <form id="predict-form">
    <input type="text" id="user_name" placeholder="Your Name" required />
    <input type="email" id="user_email" placeholder="Your Email" required />

    <input type="number" id="age" placeholder="Age" required />
    <input type="number" id="sex" placeholder="Sex (0 = female, 1 = male)" required />
    <input type="number" id="cp" placeholder="Chest Pain Type (0–3)" required />
    <input type="number" id="trestbps" placeholder="Resting BP" required />
    <input type="number" id="chol" placeholder="Cholesterol" required />
    <input type="number" id="fbs" placeholder="Fasting Blood Sugar (0/1)" required />
    <input type="number" id="restecg" placeholder="Rest ECG (0–2)" required />
    <input type="number" id="thalach" placeholder="Max Heart Rate" required />
    <input type="number" id="exang" placeholder="Exercise Induced Angina (0/1)" required />
    <input type="number" id="oldpeak" placeholder="ST Depression" step="0.1" required />
    <input type="number" id="slope" placeholder="Slope (0–2)" required />
    <input type="number" id="ca" placeholder="Number of Major Vessels (0–3)" required />
    <input type="number" id="thal" placeholder="Thal (1–3)" required />

    <input type="submit" value="Predict and Email Me" />
  </form>

  <div id="result"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
